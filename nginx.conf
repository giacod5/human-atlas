# App container nginx. Plain HTTP on :80; TLS is done by the edge proxy (Caddy) on the VPS.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Vite output is content-hashed.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # NOTE: body-*.bin.gz are sent as plain bytes (no Content-Encoding); the app gunzips them itself
    # (app/model-download.ts). Not hashed, so cache 1 day and let ETag revalidate.
    location /models/ {
        add_header Cache-Control "public, max-age=86400";
    }
}
